<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <fieldset>
        <form action="#">
            <h1>Application Form</h1>
            <label for="Fullname">Fullname<span style="color: red">*</span> :</label>
            <input type="text" id="Fullname" Placeholder="Enter name" required>
            <br><br>
            <label for="email">Email :</label>
            <input type="email" id="email" placeholder="Enter email">
            <br><br>
            <label for="Password">Password :</label>
            <input type="Password" id="Password" required>
            <br><br>
            <label for="">DOB :</label>
            <input type="date" id="">
            <br><br>
            <label for="Age">Age :</label>
            <input type="number" id="Age">
            <br><br>
            <label for="Contact">Contact :</label>
            <input type="tel" id="Contact">
            <br><br>
            <label for="">Course :</label>
            <input type="checkbox" id="">Java
            <input type="checkbox" id="">Python
            <input type="checkbox" id="">WD 
            <input type="checkbox" id="">SQL     
            <br><br>
            <label for="Gender">Gender :</label>
            <input type="radio" name="Gender">Male
            <input type="radio" name="Gender">Female
            <br><br>
            <label for="Address">Address :</label>
            <textarea name="" id="Address" cols="30" rows="5"></textarea>
            <br><br>
            <label for="Branch">Branch :</label>
            <select name="" id="Branch">
                <option value="">Select</option>
                <option value="">Pune</option>
                <option value="">Mumbai</option>
                <option value="">Nashik</option>
            </select>
            <br><br>
            <label for="">Sign</label>
            <input type="file" id="">
            <br><br>
            <button>Submit</button>
        </form>
</body>
