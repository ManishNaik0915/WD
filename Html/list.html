<!DOCTYPE html>
<html lang="en"> 
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!--1.meta tag used for responsive behaviour 2.used to provide additional info-->
    <title>Text formatting tags</title> <!--To white the title of web page-->
</head>
<body>
    <!--Ordered list/ Number list-->
    <ol type="A" Start="1">
        <li>Java</li>
        <li>Python</li>
        <li>Testing</li>
        <li>SQL</li>
    </ol>
    <!--Unordered list/ Bulleted list-->
    <ul>
        <li>Java</li>
        <li>Python</li>
        <li>Testing</li>
        <li>SQL</li>
    </ul>
    <!---description/Definition list-->
    <dl>

        <dd>
            Lorem ipsum dolor sit amet consectetur adipisicing elit. Sunt quibusdam alias quidem ab harum architecto provident quos accusamus? Quam, repudiandae.
